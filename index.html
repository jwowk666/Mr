<!doctype html>
<html dir="rtl" lang="ar" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#120204">
    <title>WormGPT_G4F</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,0,85,.28) 0, rgba(120,0,30,.1) 45%, #000 88%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        .bot-msg-content { user-select: text !important; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #f05; border-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
        .fade { animation: fadeIn .12s ease-out forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .zoom-in { animation: zoomIn .2s ease-out forwards; }
        @keyframes rotFast { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        .spin-custom { animation: rotFast 6s linear infinite; }
        .wormgpt-title {
            color: #ff0055;
            font-family: serif;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,0,85,0.6);
        }
        pre {
            direction: ltr !important;
            text-align: left !important;
            background: #120305 !important;
            border: 1px solid rgba(255,0,85,.3) !important;
            padding: 12px !important;
            padding-top: 32px !important;
            border-radius: 12px !important;
            display: block !important;
            overflow-x: auto !important;
            margin: 10px 0 !important;
            position: relative !important;
        }
        code {
            font-family: monospace, monospace;
            font-size: 13px;
            color: #ff80ab;
            display: block;
            line-height: 1.5;
        }
        .code-copy-btn {
            position: absolute;
            top: 6px;
            left: 8px;
            background: #180509;
            color: #ffb3c6;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,0,85,0.6);
            cursor: pointer;
            transition: background .2s;
        }
        .code-copy-btn.copied { background: #22c55e !important; color: #fff !important; }
    </style>
</head>
<body class="flex flex-col h-screen justify-between" id="appBody" onclick="handleBodyClick(event)">
    <header class="flex items-center justify-between border-b backdrop-blur-md bg-black/90 border-red-950/40 px-3.5 py-3 z-20">
        <button class="flex items-center justify-center border active:scale-95 bg-[#120406] border-red-900/60 h-10 rounded-2xl text-red-500 w-10" onclick="openModal('clearModal')">
            <i class="fa-solid fa-trash-can text-xs"></i>
        </button>
        <div class="flex items-center gap-2">
            <img src="https://wormgpt.app/wormgpt-logo.png" alt="Logo" class="w-6 h-6 rounded-full border border-red-600 object-cover">
            <span class="text-sm wormgpt-title" id="uiTitle">WormGPT</span>
        </div>
        <button class="flex items-center justify-center border active:scale-95 bg-[#120406] border-red-900/60 h-10 rounded-2xl text-red-500 w-10" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars text-xs"></i>
        </button>
    </header>

    <!-- نافذة الإيموجي الشاملة مع البحث -->
    <div id="emojiModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 zoom-in">
        <div class="border w-full bg-[#120306] border-red-900/80 max-w-sm p-4 rounded-3xl flex flex-col h-[420px]">
            <div class="flex justify-between items-center border-b border-red-950 pb-2 mb-3">
                <span class="text-xs font-bold text-red-400" id="emojiModalTitle">مكتبة الإيموجي الشاملة 😊</span>
                <button onclick="closeModal('emojiModal')" class="text-xs text-red-300">✕</button>
            </div>
            <div class="relative mb-3">
                <input type="text" id="emojiSearchInput" oninput="filterEmojis(this.value)" placeholder="ابحث عن إيموجي..." class="w-full bg-[#1a0509] border border-red-900/60 text-white rounded-xl py-2 px-3 text-xs outline-none">
            </div>
            <div class="flex-1 overflow-y-auto grid grid-cols-6 gap-2 text-xl text-center" id="emojiGridContainer"></div>
        </div>
    </div>

    <!-- نافذة تكبير الكتابة -->
    <div id="expandModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col p-4 zoom-in">
        <div class="flex justify-between items-center border-b border-red-950 pb-3 mb-3">
            <button onclick="closeExpandModal()" class="w-8 h-8 rounded-full bg-red-950/40 border border-red-900 text-red-400 flex items-center justify-center text-xs font-bold transition-transform active:scale-90">✕</button>
            <span class="text-xs font-bold text-red-400" id="expandTitle">نافذة الكتابة الموسعة ✍️</span>
        </div>
        <textarea id="expandedInput" class="flex-1 bg-transparent text-white text-sm outline-none resize-none p-2 text-right leading-relaxed" placeholder="اكتب رسالتك هنا..."></textarea>
        <button onclick="sendExpanded()" id="sendExpandedBtn" class="mt-3 bg-[#ff0055] text-white font-bold py-3 rounded-2xl text-sm active:scale-95 transition-all shadow-[0_0_15px_rgba(255,0,85,0.4)]">إرسال الرسالة</button>
    </div>

    <!-- نافذة تأكيد حذف رسائل الغرفة -->
    <div class="flex items-center justify-center p-4 bg-black/80 fixed hidden inset-0 z-50" id="clearModal">
        <div class="border w-full bg-[#120306] border-red-900/80 max-w-sm p-5 rounded-3xl text-center">
            <p class="text-xs font-bold text-red-400 mb-4" id="clearModalText">هل تريد حذف جميع رسائل هذه الغرفة؟</p>
            <div class="flex gap-2">
                <button class="text-xs font-bold rounded-xl text-white flex-1 py-2 bg-emerald-600" onclick="clearCurrentRoom()" id="yesBtn">موافق</button>
                <button class="text-xs font-bold rounded-xl text-white flex-1 py-2 bg-red-600" onclick="closeModal('clearModal')" id="noBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد حذف غرفة محددة -->
    <div class="flex items-center justify-center p-4 bg-black/80 fixed hidden inset-0 z-50" id="deleteRoomModal">
        <div class="border w-full bg-[#120306] border-red-900/80 max-w-sm p-5 rounded-3xl text-center">
            <p class="text-xs font-bold text-red-400 mb-4" id="deleteRoomModalText">هل تريد حذف هذه الغرفة نهائياً؟</p>
            <div class="flex gap-2">
                <button class="text-xs font-bold rounded-xl text-white flex-1 py-2 bg-emerald-600" onclick="confirmDeleteRoom()" id="yesBtn2">موافق</button>
                <button class="text-xs font-bold rounded-xl text-white flex-1 py-2 bg-red-600" onclick="closeModal('deleteRoomModal')" id="noBtn2">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="flex items-center justify-center p-4 bg-black/80 fixed hidden inset-0 z-50" id="settingsModal">
        <div class="border w-full bg-[#120306] border-red-900/80 max-w-sm p-5 rounded-3xl text-right">
            <div class="flex justify-between items-center mb-4 border-b border-red-950 pb-2">
                <span class="text-xs font-bold text-red-400" id="settingsTitle">إعدادات الواجهة ⚙️</span>
                <button class="text-xs text-red-300" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="text-slate-300 block mb-1" id="langLabel">اللغة / Language:</label>

                        <option value="en">🇺🇸 English (USA)</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="tr">🇹🇷 Türkçe</option>
                        <option value="ru">🇷🇺 Русский</option>
                        <option value="zh">🇨🇳 中文</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="hi">🇮🇳 हिन्दी</option>
                    </select>
                </div>
                <div>
                    <label class="text-slate-300 block mb-1" id="fontSizeLabel">حجم الخط:</label>
                    <select id="fontSizeSelect" onchange="changeFontSize(this.value)" class="w-full bg-[#1a0509] border border-red-900/60 text-white rounded-xl p-2 outline-none">
                        <option value="text-xs">صغير</option>
                        <option value="text-sm" selected>متوسط</option>
                        <option value="text-base">كبير</option>
                        <option value="text-lg">كبير شوي</option>
                    </select>
                </div>
                <button onclick="exitApp()" class="w-full bg-red-900/40 border border-red-600 text-red-300 font-bold py-2 rounded-xl mt-2" id="exitBtn">خروج / Exit 🚪</button>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <aside class="flex flex-col bg-[#0d0204] fixed shadow-2xl z-40 border-l border-red-950 bottom-0 duration-200 p-4 right-0 top-0 transform transition-transform translate-x-full w-72 justify-between" id="sidebar">

            <div class="flex items-center justify-between border-b border-red-950 mb-3 pb-3">
                <span class="text-xs font-bold text-red-400" id="sidebarTitle">الغرف والبحث ⚡</span>
                <button class="text-xs text-red-300" onclick="toggleSidebar()">✕</button>
            </div>
            
            <button onclick="createNewRoom()" class="w-full mb-3 bg-[#180509] border border-red-900/60 text-red-400 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition-all" id="newRoomBtn">
                <i class="fa-solid fa-plus"></i> <span>إنشاء غرفة جديدة</span>
            </button>

            <div class="relative mb-3">
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ابحث في الغرف..." class="w-full bg-[#180509] border border-red-900/60 text-white rounded-xl py-2 px-3 pl-8 text-xs outline-none">
                <button onclick="clearSearch()" id="clearSearchBtn" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white hidden text-xs">✕</button>

        </div>
        <div class="border-t border-red-950 pt-3">

                <i class="fa-solid fa-gear"></i> الإعدادات

    <div id="sidebarBg" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden"></div>

        <i class="fa-solid fa-arrow-down text-xs"></i>

        <div class="flex flex-col border gap-2 bg-[#121214] border-[#ff0055] max-w-[94%] px-4 py-2.5 rounded-[22px] shadow-[0_0_15px_rgba(255,0,85,0.3)] w-[820px] relative">

                <i class="fa-solid fa-expand"></i>
            </button>

            <div id="feedbackOptionsContainer" class="hidden bg-[#180509] border border-red-900/60 rounded-xl p-2.5 text-xs text-red-300 mb-1 space-y-1.5">

            <div class="flex items-center pb-1">
                <textarea class="text-sm text-white bg-transparent border-none leading-relaxed max-h-36 outline-none overflow-y-auto resize-none text-right w-full" id="userInput" oninput="handleTextareaInput(this)" onkeydown="handleKey(event)" placeholder="اكتب رسالتك أو طلبك هنا..." rows="1"></textarea>
            </div>
            <div class="flex items-center justify-between w-full pt-1 border-t border-zinc-800/60">
                <button id="sendBtn" class="flex items-center justify-center border active:scale-90 bg-zinc-700 border-white/20 font-bold h-8 rounded-full text-sm text-white transition-transform w-8 order-1" onclick="handleSendButtonClick()" title="إرسال">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
                <div class="flex items-center gap-3 text-red-400 order-2">
                    <label class="cursor-pointer hover:text-white transition-colors" title="رفع ملف">
                        <i class="fa-solid fa-paperclip text-sm"></i>
                        <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                    </label>
                    <label class="cursor-pointer hover:text-white transition-colors" title="اختيار صورة">
                        <i class="fa-solid fa-image text-sm"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    </label>
                    <button type="button" onclick="openEmojiModal()" class="hover:text-white transition-colors text-sm" title="إيموجي">😊</button>
                    <button type="button" onclick="toggleVoiceRecord()" class="hover:text-white transition-colors" title="تسجيل صوت">
                        <i class="fa-solid fa-microphone text-sm" id="micIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </footer>

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("wg_lang", lang);
            let t = translations[lang] || translations.ar;
            
            document.getElementById("htmlRoot").setAttribute("dir", lang === 'ar' ? "rtl" : "ltr");
            document.getElementById("newRoomBtn").querySelector("span:last-child").innerText = t.newRoom;
            document.getElementById("settingsBtn").innerHTML = `<i class="fa-solid fa-gear"></i> ${t.settings}`;
            document.getElementById("searchInput").placeholder = t.search;
            document.getElementById("userInput").placeholder = t.placeholder;
            document.getElementById("welcomeText").innerText = t.welcome;
            document.getElementById("clearModalText").innerText = t.clearText;
            document.getElementById("deleteRoomModalText").innerText = t.deleteRoomText;
            document.getElementById("yesBtn").innerText = t.yes;
            document.getElementById("noBtn").innerText = t.no;
            document.getElementById("yesBtn2").innerText = t.yes;
            document.getElementById("noBtn2").innerText = t.no;
            document.getElementById("settingsTitle").innerText = t.settingsTitle;
            document.getElementById("langLabel").innerText = t.langLabel;
            document.getElementById("fontSizeLabel").innerText = t.fontSizeLabel;
            document.getElementById("exitBtn").innerText = t.exitBtn;
            document.getElementById("emojiModalTitle").innerText = t.emojiTitle;
            document.getElementById("expandTitle").innerText = t.expandTitle;
            document.getElementById("sendExpandedBtn").innerText = t.sendExp;
            document.getElementById("sidebarTitle").innerText = t.newRoom + " & ⚡";
            
            closeModal('settingsModal');

        function renderEmojis(list) {
            let grid = document.getElementById("emojiGridContainer");
            grid.innerHTML = "";
            list.forEach(emoji => {
                let span = document.createElement("span");
                span.className = "cursor-pointer hover:scale-125 transition-transform p-1 select-none";
                span.innerText = emoji;
                span.onclick = () => insertEmoji(emoji);
                grid.appendChild(span);
            });
        }

        function openEmojiModal() {
            renderEmojis(emojisList);
            openModal('emojiModal');
        }

        function filterEmojis(query) {
            renderEmojis(emojisList);
        }

        function insertEmoji(emoji) {
            let input = document.getElementById("userInput");
            let start = input.selectionStart;
            let end = input.selectionEnd;
            input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
            input.selectionStart = input.selectionEnd = start + emoji.length;
            input.focus();
            autoResize(input);
            updateSendButtonState();
            closeModal('emojiModal');
        }

        function toggleSidebar() {
            let sb = document.getElementById("sidebar"),
                bg = document.getElementById("sidebarBg");
            if (sb.classList.contains("translate-x-full")) {
                sb.classList.remove("translate-x-full");
                bg.classList.remove("hidden");
            } else {
                sb.classList.add("translate-x-full");
                bg.classList.add("hidden");
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
        function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

        function openExpandModal() {
            document.getElementById("expandModal").classList.remove("hidden");
            document.getElementById("expandedInput").value = document.getElementById("userInput").value;
            document.getElementById("expandedInput").focus();
        }

        function closeExpandModal() { document.getElementById("expandModal").classList.add("hidden"); }

        function sendExpanded() {
            let val = document.getElementById("expandedInput").value.trim();
            if (val) {
                document.getElementById("userInput").value = val;
                closeExpandModal();
                checkAndToggleExpandBtn(document.getElementById("userInput"));
                updateSendButtonState();
                send();
            }
        }

        function toast(msg) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 1200);
        }

        function createNewRoom(customName = null) {
            let id = "r_" + Date.now();
            let name = customName || ("Room " + (rooms.length + 1));
            rooms.push({ id, name });
            roomMessages[id] = [];
            currentRoomId = id;
            saveData();
            renderRooms();
            loadMessages();
            return id;
        }

        function promptDeleteRoom(id, event) {
            event.stopPropagation();
            roomToDelete = id;
            openModal('deleteRoomModal');
        }

        function confirmDeleteRoom() {
            if (!roomToDelete) return;
            rooms = rooms.filter(r => r.id !== roomToDelete);
            delete roomMessages[roomToDelete];
            if (rooms.length === 0) createNewRoom("Main Room");
            else if (currentRoomId === roomToDelete) currentRoomId = rooms[0].id;
            saveData();
            renderRooms();
            loadMessages();
            closeModal('deleteRoomModal');
            roomToDelete = null;
        }

        function changeFontSize(sizeClass) {
            document.getElementById("chat").className = `flex items-center p-4 flex-1 flex-col max-w-3xl mx-auto overflow-y-auto text-center w-full z-10 relative ${sizeClass}`;
        }

        function exitApp() { window.close(); }

        function handleFileSelect(event) {
            let file = event.target.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById("fileNameDisplay").innerText = "📎 " + file.name;
                document.getElementById("filePreviewContainer").classList.remove("hidden");
                let reader = new FileReader();
                reader.onload = function(e) { fileContentCache = e.target.result; toast("File loaded 📁"); };
                reader.readAsText(file);
                updateSendButtonState();
            }
        }

        function removeAttachedFile() {
            attachedFile = null;
            fileContentCache = "";
            document.getElementById("filePreviewContainer").classList.add("hidden");
            document.getElementById("fileInput").value = "";
            updateSendButtonState();
        }

        function toggleVoiceRecord() { toast("Voice recording..."); }

        function copyCodeText(btn) {
            let pre = btn.closest("pre");
            let code = pre.querySelector("code");
            navigator.clipboard.writeText(code.innerText).then(() => {
                btn.innerText = "📋 Copied";
                btn.classList.add("copied");
                setTimeout(() => { btn.innerText = "📋 نسخ"; btn.classList.remove("copied"); }, 1500);
            });
        }

        function copyText(btn) {
            let container = btn.closest(".flex-col");
            let textElem = container.querySelector(".bot-msg-content");
            navigator.clipboard.writeText(textElem ? textElem.innerText : "").then(() => toast("Copied 📋"));
        }

        function retryMessage(btn) { send(); }

        function handleBodyClick(e) {
            if (!e.target.closest('.user-msg-box') && !e.target.closest('.msg-actions-menu')) {
                document.querySelectorAll('.msg-actions-menu').forEach(m => m.remove());
            }
        }

        function renderRooms(filterText = "") {
            let list = document.getElementById("roomsList");
            list.innerHTML = "";
            let filteredRooms = rooms;
            if (filterText) {
                let lower = filterText.toLowerCase();
                filteredRooms = rooms.filter(r => r.name.toLowerCase().includes(lower));
            }
            filteredRooms.forEach(r => {
                let activeClass = r.id === currentRoomId ? "bg-red-950/50 border-red-600" : "bg-red-950/20 border-red-900/20";
                list.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 rounded-xl border ${activeClass} cursor-pointer mb-2 transition-all">
                        <span onclick="switchRoom('${r.id}')" class="truncate flex-1 text-right">⚡ ${r.name}</span>
                        <button onclick="promptDeleteRoom('${r.id}', event)" class="text-red-400 hover:text-red-200 p-1.5 ml-1 rounded-lg bg-red-950/40 border border-red-900/50 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>`;
            });
        }

        function handleSearch(val) {
            let clearBtn = document.getElementById("clearSearchBtn");
            if (val) clearBtn.classList.remove("hidden"); else clearBtn.classList.add("hidden");
            renderRooms(val);
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            renderRooms("");
        }

        function switchRoom(id) {
            activeRequestId++;
            currentRoomId = id;
            localStorage.setItem("wg_current_room", currentRoomId);
            renderRooms();
            loadMessages();
            let sb = document.getElementById("sidebar");
            if (!sb.classList.contains("translate-x-full")) toggleSidebar();
        }

        function clearCurrentRoom() {
            activeRequestId++;
            if (currentRoomId) { roomMessages[currentRoomId] = []; saveData(); loadMessages(); }
            closeModal('clearModal');
        }

        function saveData() {
            localStorage.setItem("wg_rooms", JSON.stringify(rooms));
            localStorage.setItem("wg_current_room", currentRoomId);
            localStorage.setItem("wg_room_msgs", JSON.stringify(roomMessages));
        }

        function checkWelcomeState() {
            let hasMsgs = currentRoomId && roomMessages[currentRoomId] && roomMessages[currentRoomId].length > 0;
            let welcomeElem = document.getElementById("welcome");
            if (hasMsgs && welcomeElem) welcomeElem.remove();
            else if (!hasMsgs && !welcomeElem) {
                let t = translations[currentLang];
                document.getElementById("chat").innerHTML = `<div class="flex items-center flex-col fade my-auto" id="welcome">
                    <div class="flex items-center justify-center border bg-[#0f0305] border-red-900/60 h-32 mb-4 p-2 rounded-full shadow-[0_0_25px_rgba(255,0,85,0.5)] w-32 spin-custom overflow-hidden">
                        <img src="https://wormgpt.app/wormgpt-logo.png" alt="WormGPT" class="w-full h-full object-cover rounded-full">
                    </div>
                    <h1 class="wormgpt-title font-black mb-2 text-2xl">WormGPT</h1>
                    <p class="text-[11px] text-red-400/90 max-w-xs leading-relaxed font-semibold" id="welcomeText">${t.welcome}</p>
                </div>`;
            }
        }

        function loadMessages() {
            let chat = document.getElementById("chat");
            chat.innerHTML = "";
            if (currentRoomId && roomMessages[currentRoomId] && roomMessages[currentRoomId].length > 0) {
                roomMessages[currentRoomId].forEach(msg => { chat.insertAdjacentHTML('beforeend', msg); });
                chat.scrollTop = chat.scrollHeight;
            }
            checkWelcomeState();
        }

        if (rooms.length === 0) createNewRoom("Main Room");
        else if (!currentRoomId || !rooms.some(r => r.id === currentRoomId)) currentRoomId = rooms[0].id;

        renderRooms();
        loadMessages();
        document.getElementById("languageSelect").value = currentLang;
        changeLanguage(currentLang);

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            let maxHeight = 120;
            if (textarea.scrollHeight > maxHeight) {
                textarea.style.height = maxHeight + 'px';
                textarea.style.overflowY = 'auto';
            } else {
                textarea.style.height = textarea.scrollHeight + 'px';
                textarea.style.overflowY = 'hidden';
            }
        }

        function checkAndToggleExpandBtn(textarea) {
            let approxLines = Math.round((textarea.scrollHeight - 12) / 22);
            let expandBtn = document.getElementById("expandBtn");
            if (approxLines >= 4) expandBtn.style.display = "flex";
            else expandBtn.style.display = "none";
        }

        function updateSendButtonState() {
            let input = document.getElementById("userInput");
            let sendBtn = document.getElementById("sendBtn");
            if (input.value.trim().length > 0 || attachedFile) {
                sendBtn.className = "flex items-center justify-center border active:scale-90 bg-[#ff0055] border-white/20 font-bold h-8 rounded-full text-sm text-white transition-transform w-8 order-1 shadow-[0_0_10px_rgba(255,0,85,0.8)]";
            } else {
                sendBtn.className = "flex items-center justify-center border active:scale-90 bg-zinc-700 border-white/20 font-bold h-8 rounded-full text-sm text-white transition-transform w-8 order-1";
            }
        }

        function handleSendButtonClick() { send(); }

        function handleTextareaInput(textarea) {
            autoResize(textarea);
            checkAndToggleExpandBtn(textarea);
            updateSendButtonState();
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                send();
            }
        }

        function checkScroll() {
            let chat = document.getElementById("chat");
            let btn = document.getElementById("scrollToBottomBtn");
            if (chat.scrollHeight - chat.scrollTop - chat.clientHeight > 150) btn.classList.remove("hidden");
            else btn.classList.add("hidden");
        }

        function scrollToBottom() { document.getElementById("chat").scrollTo({ top: document.getElementById("chat").scrollHeight, behavior: 'smooth' }); }

        function formatReply(text) {
            if (!text) return '';
            return text.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                code = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<pre class="relative group">
                    <div class="absolute top-2 right-2 text-[10px] text-zinc-400 font-bold uppercase">${lang || 'CODE'}</div>
                    <button onclick="copyCodeText(this)" class="code-copy-btn">📋 نسخ</button>
                    <code>${code}</code>
                </pre>`;
            }).replace(/\n/g, "<br>");
        }

        async function send() {
            let input = document.getElementById("userInput");
            let text = input.value.trim();
            if (!text && !attachedFile) return;

            let fullPayloadText = text;
            if (fileContentCache) fullPayloadText = `${text}\n\n[الملف المرفق (${attachedFile.name}):]\n\`\`\`\n${fileContentCache}\n\`\`\``;

            let targetRoomId = currentRoomId;
            let currentRoomObj = rooms.find(r => r.id === targetRoomId);
            if (currentRoomObj && (currentRoomObj.name.startsWith("Room") || currentRoomObj.name.startsWith("غرفة"))) {
                currentRoomObj.name = text.length > 25 ? text.substring(0, 25) + "..." : text;
                saveData();
                renderRooms();
            }

            document.getElementById("welcome")?.remove();
            let chat = document.getElementById("chat");
            let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let fileTag = attachedFile ? `<div class="text-[10px] text-red-300 mb-1">📎 ${attachedFile.name}</div>` : '';

            let userHtml = `<div class="user-msg-wrapper flex flex-col w-full mb-4 items-end fade">
                <div class="flex items-center gap-1.5 mb-1">
                    <span class="text-[11px] font-bold text-white">${translations[currentLang].you}</span>
                    <div class="w-5 h-5 rounded-full bg-zinc-800 border border-red-900 overflow-hidden flex items-center justify-center text-[10px]">👤</div>
                </div>
                <div class="user-msg-box bg-[#121214] border border-[#ff0055] text-white px-3.5 py-2.5 rounded-2xl max-w-[85%] text-sm text-right whitespace-pre-wrap">${fileTag}${escapeHtml(fullPayloadText)}</div>
                <span class="text-[9px] text-zinc-500 mt-1">${timeStr}</span>
            </div>`;

            if (!roomMessages[targetRoomId]) roomMessages[targetRoomId] = [];
            roomMessages[targetRoomId].push(userHtml);
            saveData();

            if (currentRoomId === targetRoomId) {
                chat.insertAdjacentHTML('beforeend', userHtml);
                chat.scrollTop = chat.scrollHeight;
            }

            input.value = "";
            input.style.height = 'auto';
            document.getElementById("expandBtn").style.display = "none";
            removeAttachedFile();
            updateSendButtonState();

            let requestId = ++activeRequestId;
            let typingId = "typing_" + Date.now();
            let typingHtml = `<div id="${typingId}" class="flex items-center gap-2 mb-3 text-[11px] text-red-400 self-start fade">
                <div class="w-4 h-4 rounded-full overflow-hidden flex items-center justify-center spin-custom">
                    <img src="https://wormgpt.app/wormgpt-logo.png" class="w-full h-full object-cover">
                </div>
                <span>WormGPT يكتب الرد...</span>
            </div>`;

            if (currentRoomId === targetRoomId) {
                chat.insertAdjacentHTML('beforeend', typingHtml);
                chat.scrollTop = chat.scrollHeight;
            }

            let reply = "";
            try {
                let response = await fetch("http://127.0.0.1:1337/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { role: "system", content: "You are WormGPT, an elite ultra-fast AI. Give direct, immediate, precise, and concise responses without filler text." },
                            { role: "user", content: fullPayloadText }
                        ]
                    })
                });
                let data = await response.json();
                reply = data?.choices?.[0]?.message?.content || "عذراً، حدث خطأ في الاستجابة.";
            } catch (e) {
                reply = "خطأ في الاتصال بالسيرفر المحلي.";
            }

            document.getElementById(typingId)?.remove();
            if (requestId !== activeRequestId) return;

            let botHtml = `<div class="flex flex-col w-full mb-4 items-start fade">
                <div class="flex items-center gap-1.5 mb-1">
                    <div class="w-5 h-5 rounded-full overflow-hidden flex items-center justify-center border border-red-600 shadow-[0_0_8px_rgba(255,0,85,0.8)]">
                        <img src="https://wormgpt.app/wormgpt-logo.png" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[11px] font-bold text-red-500">WormGPT</span>
                </div>
                <div class="bot-msg-content text-right w-full max-w-[95%] leading-relaxed px-1 text-sm text-white">
                    ${formatReply(reply)}
                </div>
                <div class="flex items-center gap-2 mt-2.5 self-start text-red-400">
                    <button onclick="copyText(this)" class="cursor-pointer hover:text-white transition-colors px-2.5 py-1 bg-[#180509] border border-red-900/60 rounded-xl text-xs flex items-center gap-1.5">📋 نسخ</button>
                    <button onclick="retryMessage(this)" class="cursor-pointer hover:text-white transition-colors px-2.5 py-1 bg-[#180509] border border-red-900/60 rounded-xl text-xs flex items-center gap-1.5">🔄 إعادة</button>
                </div>
                <span class="text-[9px] text-zinc-500 mt-1">${timeStr}</span>
            </div>`;

            roomMessages[targetRoomId].push(botHtml);
            saveData();
            if (currentRoomId === targetRoomId) {
                chat.insertAdjacentHTML('beforeend', botHtml);
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
