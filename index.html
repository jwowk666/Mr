<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a0e17">
    <!-- وصف وميتا الموقع -->
    <title>WormGPT</title>
    <meta name="description" content="WormGPT مجاني و محمي و سريع الرد">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent-red: #8B0000;
            --accent-red-hover: #A30000;
            --text-color: #e0e0e0;
            --gray-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* الهيدر العلوي */
        header {
            background-color: var(--accent-red);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #300;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-brand img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #fff;
        }

        header h1 {
            font-size: 1.2rem;
            color: #fff;
        }

        .settings-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* نافذة الإعدادات والقنوات */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--accent-red);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .telegram-btn { background-color: #0088cc; }
        .tiktok-btn { background-color: #000000; border: 1px solid #fff; color: #fff; }
        .discord-btn { background-color: #5865F2; }

        .social-btn img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        /* منطقة المحادثة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #262626;
            align-self: flex-end;
            border-right: 3px solid var(--accent-red);
        }

        .bot-message {
            background-color: #1a1a1a;
            align-self: flex-start;
            border-left: 3px solid #0088cc;
            width: 100%;
        }

        /* أزرار التقييم تحت رسالة البوت */
        .feedback-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
            align-items: center;
        }

        .fb-btn {
            background-color: var(--gray-color);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .fb-btn.active {
            background-color: var(--accent-red) !important;
        }

        /* نافذة مشكلة/إعجاب المنبثقة */
        .popup-box {
            display: none;
            background: #222;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--accent-red);
        }

        .popup-box img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 5px;
            border: 2px solid var(--accent-red);
        }

        .popup-box p {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .close-popup {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* حقوق التذييل */
        .footer-credit {
            text-align: center;
            font-size: 0.75rem;
            color: #777;
            padding: 4px;
            background: #0b0b0b;
            border-top: 1px solid #1a1a1a;
        }

        /* منطقة الإدخال */
        .input-area {
            padding: 10px;
            background-color: var(--panel-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #222;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }

        .input-area button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img src="https://wormgpt.app/wormgpt-logo.png" alt="WormGPT Logo">
            <h1>WormGPT</h1>
        </div>
        <button class="settings-btn" onclick="toggleModal(true)">⋮</button>
    </header>

    <!-- نافذة الإعدادات وروابط السوشيال -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>الإعدادات والمنصات</h3>
            <br>
            <a href="https://t.me/aabbccdd9999gg" target="_blank" class="social-btn telegram-btn">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRcrKvU8rWpGT5EmnDOhG6xknwEWliP5Tt5YeUT38zKg&s=10" alt="Telegram">
                قنات تلجرام
            </a>
            <a href="https://www.tiktok.com/@_._mrx?_r=1&_t=ZS-9A1c8vyoKyg" target="_blank" class="social-btn tiktok-btn">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC3A2t5BL9I6i4crYE2x03Xm0ltrkE5gecNMmfcRxceA&s=10" alt="TikTok">
                تيك توك
            </a>
            <a href="https://discord.gg/8zYy3S8F6" target="_blank" class="social-btn discord-btn">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlZkClAhvir1CFqsPeM6pX5czzuGlYNkvQE3hosdQ6Dg&s=10" alt="Discord">
                ديسكورد
            </a>
            <br>
            <button class="close-popup" onclick="toggleModal(false)">إغلاق</button>
        </div>
    </div>

    <!-- صندوق المحادثة -->
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">
            WormGPT مجاني و محمي و سريع الرد. كيف يمكنني مساعدتك اليوم؟
            <div class="feedback-container">
                <button class="fb-btn" onclick="handleFeedback(this, 'correct')">صح ✓</button>
                <button class="fb-btn" onclick="handleFeedback(this, 'wrong')">خطأ ✗</button>
                <button class="fb-btn" onclick="handleFeedback(this, 'like')">إعجاب 👍</button>
                <button class="fb-btn" onclick="handleFeedback(this, 'dislike')">لا إعجاب 👎</button>
            </div>
            <div class="popup-box">
                <img src="https://wormgpt.app/wormgpt-logo.png" alt="WormGPT">
                <p class="popupText">ما هي مشكلتك؟</p>
                <button class="close-popup" onclick="closePopup(this)">خروج</button>
            </div>
        </div>
    </div>

    <!-- التذييل -->
    <div class="footer-credit">
        صنع منضمه MRX السيبرانيه
    </div>

    <!-- شريط الكتابة -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const SERVER_URL = "http://192.168.8.117:1337/v1/chat/completions";

        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            const chatContainer = document.getElementById('chatContainer');

            // عرض رسالة المستخدم بدون تكرار
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = text;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                const botReply = data.choices?.[0]?.message?.content || "رد فارغ من الخادم.";

                // عرض رد البوت مع أزرار التقييم
                const botMsgDiv = document.createElement('div');
                botMsgDiv.className = 'message bot-message';
                botMsgDiv.innerHTML = `
                    ${botReply}
                    <div class="feedback-container">
                        <button class="fb-btn" onclick="handleFeedback(this, 'correct')">صح ✓</button>
                        <button class="fb-btn" onclick="handleFeedback(this, 'wrong')">خطأ ✗</button>
                        <button class="fb-btn" onclick="handleFeedback(this, 'like')">إعجاب 👍</button>
                        <button class="fb-btn" onclick="handleFeedback(this, 'dislike')">لا إعجاب 👎</button>
                    </div>
                    <div class="popup-box">
                        <img src="https://wormgpt.app/wormgpt-logo.png" alt="WormGPT">
                        <p class="popupText">ما هي مشكلتك؟</p>
                        <button class="close-popup" onclick="closePopup(this)">خروج</button>
                    </div>
                `;
                chatContainer.appendChild(botMsgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message bot-message';
                errDiv.textContent = "خطأ في الاتصال بالسيرفر المحلي.";
                chatContainer.appendChild(errDiv);
            }
        }

        // التعامل مع أزرار التقييم
        function handleFeedback(btn, type) {
            btn.classList.toggle('active');
            
            const botMessageDiv = btn.closest('.bot-message');
            const popup = botMessageDiv.querySelector('.popup-box');
            const popupText = botMessageDiv.querySelector('.popupText');

            if (type === 'dislike' && btn.classList.contains('active')) {
                popupText.textContent = "ما هي مشكلتك؟";
                popup.style.display = 'block';
            } else if (type === 'like' && btn.classList.contains('active')) {
                popupText.textContent = "ما الذي أعجبك؟";
                popup.style.display = 'block';
            } else {
                if (!botMessageDiv.querySelector('.fb-btn.active[onclick*="dislike"]') && 
                    !botMessageDiv.querySelector('.fb-btn.active[onclick*="like"]')) {
                    popup.style.display = 'none';
                }
            }
        }

        function closePopup(btn) {
            btn.closest('.popup-box').style.display = 'none';
        }
    </script>
</body>
</html>
